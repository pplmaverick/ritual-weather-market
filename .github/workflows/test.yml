name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Forge Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install OpenZeppelin contracts
        run: |
          git clone --depth 1 --branch v5.6.1 \
            https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git \
            contracts/lib/openzeppelin-contracts-upgradeable
          git -C contracts/lib/openzeppelin-contracts-upgradeable submodule update --init --recursive

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Run Forge tests
        working-directory: contracts
        run: forge test -vv
